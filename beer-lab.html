<script>

document.addEventListener("DOMContentLoaded", function () {

  /* =====================================================
     DEGRADE EBC -> COULEUR
     ===================================================== */

  const EBC_STOPS = [
    [2,   "#ffe699"],
    [4,   "#ffd878"],
    [6,   "#ffca5a"],
    [8,   "#ffbf42"],
    [10,  "#fbb123"],
    [14,  "#f8a600"],
    [18,  "#f39c00"],
    [24,  "#ea8f00"],
    [30,  "#e58500"],
    [38,  "#d77800"],
    [48,  "#cb6600"],
    [60,  "#c1590a"],
    [75,  "#b94e14"],
    [100, "#8a3a12"],
    [130, "#692a0f"],
    [160, "#1a0d06"]
  ];


  function hexToRgb(hex) {

    const value = hex.replace("#", "");

    return [
      parseInt(value.substring(0, 2), 16),
      parseInt(value.substring(2, 4), 16),
      parseInt(value.substring(4, 6), 16)
    ];

  }


  function rgbToHex(r, g, b) {

    const toHex = v =>
      Math.round(v)
        .toString(16)
        .padStart(2, "0");

    return "#" +
      toHex(r) +
      toHex(g) +
      toHex(b);

  }


  function ebcToColor(ebc) {

    let lower = EBC_STOPS[0];

    let upper =
      EBC_STOPS[EBC_STOPS.length - 1];


    for (
      let i = 0;
      i < EBC_STOPS.length - 1;
      i++
    ) {

      if (
        ebc >= EBC_STOPS[i][0] &&
        ebc <= EBC_STOPS[i + 1][0]
      ) {

        lower = EBC_STOPS[i];
        upper = EBC_STOPS[i + 1];

        break;

      }

    }


    const [r1, g1, b1] = hexToRgb(lower[1]);
    const [r2, g2, b2] = hexToRgb(upper[1]);

    const range =
      upper[0] - lower[0] || 1;

    const ratio =
      Math.min(
        Math.max(
          (ebc - lower[0]) / range,
          0
        ),
        1
      );


    return rgbToHex(

      r1 + (r2 - r1) * ratio,
      g1 + (g2 - g1) * ratio,
      b1 + (b2 - b1) * ratio

    );

  }


  /* =====================================================
     ELEMENTS
     ===================================================== */

  const nameInput =
    document.getElementById("nameInput");

  const ebcSlider =
    document.getElementById("ebcSlider");

  const abvSlider =
    document.getElementById("abvSlider");

  const ebcValue =
    document.getElementById("ebcValue");

  const abvValue =
    document.getElementById("abvValue");

  const ebcMetric =
    document.getElementById("ebcMetric");

  const abvMetric =
    document.getElementById("abvMetric");

  const recipeName =
    document.getElementById("recipeName");

  const bottle =
    document.getElementById("bottle");

  const bottleLabel =
    document.getElementById("bottleLabel");

  const confirmMsg =
    document.getElementById("confirmMsg");

  const wallList =
    document.getElementById("wallList");

  const submitBtn =
    document.getElementById("submitBtn");

  const clearBtn =
    document.getElementById("clearBtn");


  /* =====================================================
     VERIFICATION DES ELEMENTS
     ===================================================== */

  if (
    !ebcSlider ||
    !abvSlider ||
    !ebcValue ||
    !abvValue
  ) {

    console.error(
      "Beer Lab : curseurs introuvables."
    );

    return;

  }


  /* =====================================================
     ECHAPPER HTML
     ===================================================== */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =====================================================
     MISE A JOUR DE L'APERCU
     ===================================================== */

  function updatePreview() {

    const name =
      nameInput.value.trim();


    const ebc =
      Number(ebcSlider.value);


    const abv =
      Number(abvSlider.value);


    /* -------------------------
       EBC
       ------------------------- */

    ebcValue.textContent =
      ebc + " EBC";


    ebcMetric.textContent =
      ebc;


    /* -------------------------
       ALCOOL
       ------------------------- */

    const abvText =
      abv.toFixed(1)
        .replace(".", ",") + " %";


    abvValue.textContent =
      abvText;


    abvMetric.textContent =
      abvText;


    /* -------------------------
       COULEUR BOUTEILLE
       ------------------------- */

    const color =
      ebcToColor(ebc);


    bottle.style.backgroundColor =
      color;


    /* -------------------------
       NOM
       ------------------------- */

    recipeName.innerHTML =
      name
        ? escapeHTML(name)
        : '<span class="recipe-placeholder">Donne-lui un nom...</span>';


    /* -------------------------
       ETIQUETTE
       ------------------------- */

    bottleLabel.innerHTML =
      "VERIHOP<br>" +
      (
        name
          ? escapeHTML(name.slice(0, 16))
          : "BEER LAB"
      );

  }


  /* =====================================================
     EVENEMENTS DES CURSEURS
     ===================================================== */

  ebcSlider.addEventListener(
    "input",
    updatePreview
  );

  ebcSlider.addEventListener(
    "change",
    updatePreview
  );


  abvSlider.addEventListener(
    "input",
    updatePreview
  );

  abvSlider.addEventListener(
    "change",
    updatePreview
  );


  /* =====================================================
     NOM DE LA BIERE
     ===================================================== */

  nameInput.addEventListener(
    "input",
    updatePreview
  );


  /* =====================================================
     RESET
     ===================================================== */

  function clearForm() {

    nameInput.value = "";

    ebcSlider.value = "20";

    abvSlider.value = "5";

    confirmMsg.textContent = "";

    updatePreview();

  }


  clearBtn.addEventListener(
    "click",
    clearForm
  );


  /* =====================================================
     MESSAGE DE CONFIRMATION
     ===================================================== */

  function showConfirm(
    message,
    isError = false
  ) {

    confirmMsg.textContent =
      message;

    confirmMsg.classList.toggle(
      "error",
      isError
    );


    setTimeout(() => {

      confirmMsg.textContent = "";

      confirmMsg.classList.remove(
        "error"
      );

    }, 3500);

  }


  /* =====================================================
     SUPABASE
     
     IMPORTANT :
     L'initialisation est faite APRES
     les curseurs afin qu'une erreur
     Supabase ne bloque pas le Beer Lab.
     ===================================================== */

  let supabaseClient = null;

  const SUPABASE_URL =
    "https://kezdmoybnuswjtdvpmqv.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_ctMhvefmZVySxT43Pyb3xQ_tPFqXr9v";

  const TABLE_NAME =
    "beer_proposals";


  try {

    if (
      window.supabase &&
      typeof window.supabase.createClient === "function"
    ) {

      supabaseClient =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );

    } else {

      console.error(
        "Supabase JS n'est pas chargé."
      );

    }

  } catch (error) {

    console.error(
      "Erreur initialisation Supabase :",
      error
    );

  }


  /* =====================================================
     TEXTE DE LA PROPOSITION
     ===================================================== */

  function buildProposalText() {

    const name =
      nameInput.value.trim() ||
      "Sans nom";


    const ebc =
      ebcSlider.value;


    const abv =
      Number(abvSlider.value)
        .toFixed(1)
        .replace(".", ",");


    return `🍺 Proposition de bière — ${name}

Couleur : ${ebc} EBC
Taux d'alcool : ${abv} %

Envoyé depuis le VERIHOP Beer Lab`;

  }


  /* =====================================================
     ENVOYER
     ===================================================== */

  async function submitProposal() {

    const name =
      nameInput.value.trim();


    if (!name) {

      showConfirm(
        "⚠️ Donne d'abord un nom à ta bière.",
        true
      );

      nameInput.focus();

      return;

    }


    if (!supabaseClient) {

      showConfirm(
        "⚠️ Connexion à la base de données impossible.",
        true
      );

      return;

    }


    submitBtn.disabled = true;

    submitBtn.textContent =
      "⏳ Envoi...";


    const ebc =
      Number(ebcSlider.value);

    const abv =
      Number(abvSlider.value);


    const { error } =
      await supabaseClient
        .from(TABLE_NAME)
        .insert([

          {
            name: name,
            ebc: ebc,
            abv: abv
          }

        ]);


    submitBtn.disabled = false;

    submitBtn.textContent =
      "📮 Envoyer ma proposition";


    if (error) {

      console.error(error);

      showConfirm(
        "⚠️ Envoi impossible : " +
        error.message,
        true
      );

      return;

    }


    showConfirm(
      "✅ Proposition envoyée, merci !",
      false
    );


    loadProposals();

  }


  submitBtn.addEventListener(
    "click",
    submitProposal
  );


  /* =====================================================
     MUR DES PROPOSITIONS
     ===================================================== */

  async function loadProposals() {

    if (!supabaseClient) {

      wallList.innerHTML = `
        <p class="wall-empty">
          Impossible de charger les propositions.
        </p>
      `;

      return;

    }


    const { data, error } =
      await supabaseClient
        .from(TABLE_NAME)
        .select(
          "name, ebc, abv, created_at"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        )
        .limit(24);


    if (error) {

      console.error(error);

      wallList.innerHTML = `
        <p class="wall-empty">
          ⚠️ Impossible de charger les propositions.
        </p>
      `;

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      wallList.innerHTML = `
        <p class="wall-empty">
          Aucune proposition pour le moment,
          sois le premier à en envoyer une 🍺
        </p>
      `;

      return;

    }


    wallList.innerHTML =
      data
        .map(row => {

          const ebc =
            Number(row.ebc);

          const abv =
            Number(row.abv)
              .toFixed(1)
              .replace(".", ",");


          return `

            <div class="wall-card">

              <div
                class="wall-swatch"
                style="background-color:${ebcToColor(ebc)};">
              </div>

              <div>

                <div class="wall-name">
                  ${escapeHTML(row.name)}
                </div>

                <div class="wall-meta">
                  ${ebc} EBC · ${abv} %
                </div>

              </div>

            </div>

          `;

        })
        .join("");

  }


  /* =====================================================
     INITIALISATION
     ===================================================== */

  updatePreview();

  loadProposals();


});

</script>
